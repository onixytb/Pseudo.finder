
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b11">
<title>PSEUDO.FINDER V12</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <header class="topbar">
        <a class="logo" href="#" id="logoHome">
            PSEUDO<span>.FINDER</span>
        </a>
        <div class="version">V12.0</div>
    </header>

    <section id="home">
        <div class="hero">
            <div class="online"><span></span> SYSTEM ONLINE</div>
            <h1>RESEARCH<br><span>EVERYTHING.</span></h1>
            <p>Ta plateforme de recherche numérique.</p>
        </div>

        <div class="section-title">RESEARCH TOOLS</div>
        <div class="tool-grid">

            <button class="tool" data-page="pseudo">
                <span class="tool-icon">⌕</span>
                <strong>PSEUDO.FINDER</strong>
                <small>Recherche de profils</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="general">
                <span class="tool-icon">◎</span>
                <strong>GENERAL SEARCH</strong>
                <small>Recherche multi-sites</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="osint">
                <span class="tool-icon">⌘</span>
                <strong>OSINT.FINDER</strong>
                <small>Sources publiques</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="network">
                <span class="tool-icon">⌁</span>
                <strong>NETWORK.FINDER</strong>
                <small>Informations réseau</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="domain">
                <span class="tool-icon">🌐</span>
                <strong>DOMAIN.FINDER</strong>
                <small>Analyse DNS</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="ip">
                <span class="tool-icon">⌗</span>
                <strong>IP.LOOKUP</strong>
                <small>Informations sur ton IP</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="url">
                <span class="tool-icon">↗</span>
                <strong>URL.ANALYZER</strong>
                <small>Analyse de liens</small>
                <b>↗</b>
            </button>

            <button class="tool" data-page="history">
                <span class="tool-icon">◷</span>
                <strong>HISTORY</strong>
                <small>Historique des recherches</small>
                <b>↗</b>
            </button>
        </div>

        <div class="footer">
            PSEUDO.FINDER © 2026 — RESEARCH TOOLKIT
        </div>
    </section>

    <section id="workspace" class="hidden">
        <button class="back" id="back">← ACCUEIL</button>
        <div class="page-heading">
            <div class="online"><span></span> TOOL ACTIVE</div>
            <h2 id="pageTitle"></h2>
            <p id="pageDescription"></p>
        </div>

        <div id="searchForm" class="panel hidden">
            <input id="query" placeholder="Ta recherche..." maxlength="150">
            <div id="nameFields" class="hidden">
                <input id="firstName" placeholder="Prénom" maxlength="70">
                <input id="lastName" placeholder="Nom" maxlength="70">
            </div>
            <button id="runSearch" class="primary">LANCER LA RECHERCHE ↗</button>
        </div>

        <div id="domainForm" class="panel hidden">
            <input id="domainInput" placeholder="exemple.com" maxlength="253">
            <button id="domainBtn" class="primary">ANALYSER LE DOMAINE ↗</button>
        </div>

        <div id="urlForm" class="panel hidden">
            <input id="urlInput" placeholder="https://exemple.com" maxlength="2000">
            <button id="urlBtn" class="primary">ANALYSER LE LIEN ↗</button>
        </div>

        <div id="ipPanel" class="panel hidden">
            <p class="muted">Adresse IP publique de ta connexion actuelle</p>
            <div id="myIP" class="big-value">Non récupérée</div>
            <button id="ipBtn" class="primary">AFFICHER MON IP</button>
        </div>

        <div id="bluetoothPanel" class="panel hidden">
            <h3>BLUETOOTH</h3>
            <p class="muted">Choisis un appareil Bluetooth compatible à proximité.</p>
            <button id="bluetoothBtn" class="primary">RECHERCHER UN APPAREIL</button>
            <div id="bluetoothResult" class="result-message"></div>
        </div>

        <div id="output">
            <p id="status" class="status"></p>
            <div id="results"></div>
        </div>

        <div id="historyPanel" class="hidden">
            <button id="clearHistory" class="secondary">EFFACER L'HISTORIQUE</button>
            <div id="historyList"></div>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
